apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend-rollout
  namespace: default
spec: 
  replicas: 2
  strategy:
    blueGreen:
      activeService: backend-service
      previewService: backend-preview-service
      autoPromotionEnabled: false
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: noaman003/devsecops-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: MONGO_URI
          value: "mongodb://mongodb-service:27017/devsecops_db"
        - name: APP_VERSION
          value: "v2.0.0"
        - name: APP_COLOR
          value: "green"
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: default
spec: 
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-preview-service
  namespace: default
spec: 
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
